spring.datasource.url=jdbc:sqlite:${PSM_SQLITE_PATH:/var/lib/psm/psm.db}?busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
psm.storage.root=${PSM_STORAGE_ROOT:/var/lib/psm/uploads}
psm.storage.max-file-size-bytes=${PSM_STORAGE_MAX_FILE_SIZE:10485760}

jwt.secret=${JWT_SECRET}
