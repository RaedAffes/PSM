spring.application.name=psm
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.datasource.url=jdbc:mysql://localhost:3306/psm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

psm.admin.email=${PSM_ADMIN_EMAIL:admin@psm.com}
psm.admin.password=${PSM_ADMIN_PASSWORD:}
psm.storage.root=${PSM_STORAGE_ROOT:./uploads}
psm.storage.max-file-size-bytes=${PSM_STORAGE_MAX_FILE_SIZE:10485760}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:}

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
